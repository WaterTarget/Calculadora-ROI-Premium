<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Calculadora ROI Premium | AGRANEL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #ffffff;
            --surface: #f8fafc;
            --surface-light: #f1f5f9;
            --border: #e2e8f0;
            --primary: #2563eb;
            --primary-light: #3b82f6;
            --accent: #7c3aed;
            --text-main: #0f172a;
            --text-secondary: #64748b;
            --success: #059669;
            --warning: #d97706;
            --danger: #dc2626;
            --gradient-primary: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            --gradient-success: linear-gradient(135deg, #059669 0%, #047857 100%);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-glow: 0 0 20px rgba(37, 99, 235, 0.15);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.5rem;
        }
        .header {
            text-align: center;
            padding: 2rem 0;
            position: relative;
        }
        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 400px;
            background: radial-gradient(ellipse, rgba(37, 99, 235, 0.08) 0%, transparent 70%);
            pointer-events: none;
        }
        .header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            position: relative;
        }
        .header p {
            color: var(--text-secondary);
            font-size: 1rem;
        }
        .header img {
            max-width: 200px;
            height: auto;
            margin-bottom: 1rem;
        }
        .main-grid {
            display: grid;
            grid-template-columns: 420px 1fr;
            gap: 1.5rem;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.25rem;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0,0,0,0.05), transparent);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }
        .card-title {
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .model-item {
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 0.75rem;
            position: relative;
            transition: all 0.3s ease;
            overflow-x: hidden;
        }
        .model-item:hover {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
        }
        .model-item.model-1 { border-left: 3px solid #3b82f6; }
        .model-item.model-2 { border-left: 3px solid #f59e0b; }
        .model-item.model-3 { border-left: 3px solid #10b981; }
        .model-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }
        .model-number {
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .model-1 .model-number { color: #2563eb; }
        .model-2 .model-number { color: #d97706; }
        .model-3 .model-number { color: #059669; }
        .btn-icon {
            background: rgba(239, 68, 68, 0.1);
            border: none;
            color: var(--danger);
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.2s;
        }
        .btn-icon:hover {
            background: var(--danger);
            color: white;
        }
        .form-group {
            margin-bottom: 0.75rem;
        }
        .form-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.3rem;
        }
        .form-select, .form-input {
            width: 100%;
            background: #ffffff;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.6rem 0.75rem;
            border-radius: 6px;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .form-select:focus, .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }
        .btn {
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn-add {
            width: 100%;
            background: transparent;
            border: 2px dashed var(--border);
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }
        .btn-add:hover:not(:disabled) {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(37, 99, 235, 0.05);
        }
        .btn-add:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-whatsapp {
            background: #25d366;
            color: white;
            flex: 1;
        }
        .btn-whatsapp:hover {
            background: #128c7e;
            transform: translateY(-1px);
        }
        .btn-pdf {
            background: var(--danger);
            color: white;
            flex: 1;
        }
        .btn-pdf:hover {
            background: #dc2626;
            transform: translateY(-1px);
        }
        .btn-reset {
            background: var(--surface-light);
            color: var(--text-secondary);
            padding: 0.4rem 0.75rem;
            font-size: 0.8rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-reset:hover {
            color: var(--text-main);
            background: var(--border);
        }
        .action-buttons {
            display: flex;
            gap: 0.75rem;
            margin-top: 1.25rem;
        }
        .results-section {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            align-items: center;
        }
        .results-section > * {
            width: 100%;
            max-width: 100%;
        }
        .total-card {
            background: var(--gradient-primary);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .total-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
            animation: pulse 4s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        .total-label {
            font-size: 0.85rem;
            font-weight: 500;
            color: #ffffff;
            margin-bottom: 0.5rem;
            position: relative;
        }
        .total-value {
            font-size: 2.5rem;
            font-weight: 800;
            color: #ffffff;
            position: relative;
        }
        .recovery-hero {
            margin-top: 1rem;
            padding: 1rem 1.25rem;
            background: rgba(37, 99, 235, 0.15);
            border-radius: 10px;
            position: relative;
        }
        .recovery-hero-label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #ffffff;
        }
        .recovery-hero-value {
            font-size: 1.8rem;
            font-weight: 800;
            margin-top: 0.25rem;
            position: relative;
            color: #ffffff;
        }
        .table-wrapper {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow-x: auto;
        }
        .table-header {
            background: var(--surface-light);
            padding: 0.75rem 1.25rem;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: 0.9rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 0.75rem 1.25rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th {
            background: var(--surface-light);
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        tr:hover {
            background: var(--surface);
        }
        .text-right { text-align: right; }
        .highlight-positive { color: var(--success); font-weight: 600; }
        .highlight-negative { color: var(--danger); }
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            width: 100%;
            box-sizing: border-box;
        }
        .chart-container {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
            height: 280px;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }
